spring.application.name=Layerly-backend
# optional: sul server env.properties non esiste, i valori arrivano dalle variabili d'ambiente
spring.config.import=optional:file:env.properties
# SERVER CONFIG
# PORT e' la variabile che usano gli hosting (Render, Railway, ...)
server.port=${SERVER_PORT:${PORT:3220}}
# CORS (separate da virgola): sul server aggiungere l'URL Netlify
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# DB CONFIG
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver=org.postgresql.Driver
# HIBERNATE
spring.jpa.hibernate.ddl-auto=validate
# JWT
jwt.secret=${TOKEN_PW}
jwt.expiration=${EXPIRATION}
# MIGRATION
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# UPLOAD FOTO (default Spring: 1MB per file, troppo poco per una foto)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=120MB
# fa leggere a Tomcat il resto del body invece di chiudere la connessione:
# senza questo il browser riceve "Failed to fetch" al posto dell'errore JSON
server.tomcat.max-swallow-size=-1
# CLOUDINARY
cloudinary.cloud-name=${CLOUD_NAME}
cloudinary.api-key=${API_KEY}
cloudinary.api-secret=${API_SECRET}